global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: plant
    static_configs:
      - targets: ["exporter:9877"]

  # Only exists while the "docker" compose profile is running; the target shows as down otherwise.
  - job_name: docker
    static_configs:
      - targets: ["exporter-docker:9877"]
