# Start:   GRAFANA_ADMIN_PASSWORD=choose-one docker compose up --build
# Docker inventory too (needs the host's docker group id):
#          DOCKER_GID=$(getent group docker | cut -d: -f3) GRAFANA_ADMIN_PASSWORD=choose-one \
#          docker compose --profile docker up --build
name: plant-metrics

services:
  exporter:
    build: .
    command: ["serve", "--bind", "0.0.0.0", "--port", "9877"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["9877"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:9877/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [metrics]

  # Optional. WARNING: access to the Docker socket is root-equivalent on the host, and ":ro" does not
  # make the API read-only. For anything beyond a demo put a filtering socket proxy in between.
  exporter-docker:
    profiles: ["docker"]
    build: .
    command: ["serve", "--bind", "0.0.0.0", "--port", "9877", "--no-sim", "--docker"]
    user: "10001:10001"
    group_add: ["${DOCKER_GID:-65534}"]  # set DOCKER_GID, or the socket is unreadable and the collector reports failure
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose: ["9877"]
    networks: [metrics]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    depends_on: [exporter]
    networks: [metrics]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [metrics]

volumes:
  prometheus-data:
  grafana-data:

networks:
  metrics:
