[project]
name = "docker-metrics-exporter"
version = "0.1.0"
description = "A small Prometheus exporter (standard library only) for a simulated plant-equipment fleet and for the containers on a Docker host, with a Prometheus + Grafana compose stack. Fictional plant data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
metrics-exporter = "metrics_exporter.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metrics_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
